name: Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          add-job-summary: never

      - name: Check license headers
        run: ./gradlew checkLicenses

      - name: Compile
        shell: bash
        run: |
          set +e
          ./gradlew compileJava compileTestJava > compile.log 2>&1
          status=$?
          cat compile.log
          if [ $status -ne 0 ]; then
            # Show compiler errors as annotations so they're visible without opening the full log
            grep -E "error:|\.java:[0-9]+:|FAILURE|What went wrong" -A2 compile.log | head -40 | while IFS= read -r line; do
              echo "::error title=Compile::$line"
            done
          fi
          exit $status

  test:
    runs-on: ${{ matrix.os }}
    needs: ci
    timeout-minutes: 15
    strategy:
      matrix:
        java-version: ["8", "21"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    name: Java ${{ matrix.java-version }} (${{ matrix.os }}) Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          # MacOS (aarch64) Java 8 doesn't exist for temurin, so use zulu instead
          distribution: ${{ matrix.os =='macos-latest' && matrix.java-version == '8' && 'zulu' || 'temurin' }}
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          add-job-summary: never

      - name: Run Unit Tests
        run: ./gradlew --no-daemon test

      - name: Show failed tests
        if: failure()
        shell: bash
        run: |
          grep -h -B1 "<failure" build/test-results/test/*.xml 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::error title=Test failure::$line"
          done

      - name: Run UI Tests
        uses: GabrielBB/xvfb-action@v1
        continue-on-error: true
        with:
          run: ./gradlew --no-daemon uiTest

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: ci
    strategy:
      matrix:
        java-version: ["8", "21"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    name: Java ${{ matrix.java-version }} (${{ matrix.os }}) Build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          # MacOS (aarch64) Java 8 doesn't exist for temurin, so use zulu instead
          distribution: ${{ matrix.os =='macos-latest' && matrix.java-version == '8' && 'zulu' || 'temurin' }}
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          add-job-summary: never

      - name: Build
        run: ./gradlew build -x test

  package:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      clean-version: ${{ steps.version.outputs.CLEAN_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          add-job-summary: never

      - name: Read version and remove stream
        id: version
        run: |
          echo "VERSION=$(cat ./src/main/resources/version | tr -d ' \t\n\r')" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' ./src/main/resources/version)" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -x test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hybrid-ATLauncher
          path: dist/*
